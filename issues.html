SAMPLOOP, the sequencer and command table, PWM sweep and wave table construction. Timing figures (77 cycles/sample, 227 samples/pass) are from cycle counting; see #5 for checking them.", "status": "done", "priority": "high", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["disassembly", "docs"]}, {"id": 4, "type": "task", "summary": "Isolate and document the song data", "description": "Done before tracking began (commit 8d4778c). tools/songdump.py decodes $542D-$6394 into song/song.asm (NOTE/INSTR/DEFINS/FRAME/BEND/BRATE/ENDPAT macros, note names, tick positions); cocosid.asm INCLUDEs it and still reassembles byte for byte. song/README.md covers format, timing, tuning, instruments and quirks (SONG3 ends inside the pattern table via entry 0 = $2C00). Song length 3,936 ticks from a simulation of the sequencer. Instrument descriptions come from reading frames, not listening (see #6). Later correction (from the source cross-check): SONG3 does end with its own $00 and the pattern table starts at $553D, indexed from PATTERNS-2; the 'SONG3 runs into the pattern table' quirk described here was wrong and has been fixed.", "status": "done", "priority": "high", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["song", "docs"]}, {"id": 5, "type": "task", "summary": "Measure tick length and tuning in XRoar", "description": "song/README.md estimates a tick at about 53,600 cycles (60 ms; 3 x 17,724 for MIXER plus sequencer and PWM), a song length of about 3 min 56 s, and an effective sample rate of about 11.4 kHz, so A4 (note 69) near 425 Hz, roughly half a semitone flat. All of this is from cycle counting. Check it: e.g. run headless (xroar -no-ratelimit with -trap pc=0x48D7 snapshots, or count emulated time between restarts via a trap on RESTART $4871) and correct the README figures. The user has heard it run in XRoar but nobody has timed it. Update from #13: the author's source (Color Computer Archive, 'CocoSiD (Remz) (Coco 2)', cocosid.s) designs for 16.7 notes per second (125 BPM) and gives the song as 123 patterns, 3:56.12, which matches the estimates. That is design intent, not a measurement, so this stays open.", "status": "open", "priority": "medium", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["song", "verification"]}, {"id": 6, "type": "task", "summary": "Check instrument descriptions by ear", "description": "The 'Character' column of the instrument table in song/README.md (bass, snare-type drum, octave-arpeggio pulse, PWM lead, tom drop, ...) was inferred from frame data only. Listen in XRoar (README 'Running it') and correct any that are wrong. A quick way to audition one instrument would be a tiny test song built from song/song.asm.", "status": "open", "priority": "low", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["song", "docs"]}, {"id": 7, "type": "task", "summary": "Add deleted-file recovery to decb_extract.py", "description": "Recovery of the six files in files/deleted/ was done with an ad-hoc script: for each deleted directory entry (first name byte 0) read contiguous granules from its first granule, parse LOADM blocks to find the true length, and check the last-sector byte count. Fold that into tools/decb_extract.py (e.g. --deleted) so it is reproducible, and also scan free granules with data that no entry claims (granule 35 here). Dropped 2026-10-30: the user decided the deleted files are interesting but not important to this repo. files/deleted/ and the README's 'Recovered deleted files' section were removed; the same six files are on the author's CoCo 3 disk in third-party/cocosid-coco3/cocosid.dsk.", "status": "wontfix", "priority": "low", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["disk", "tools"]}, {"id": 8, "type": "task", "summary": "Compare the CoCo 3 build of COCOSID with the CoCo 2 build", "description": "The CoCo 3 build is COCOSID.BIN (22,833 bytes, exec $4800) on the author's CoCo 3 disk, third-party/cocosid-coco3/cocosid.dsk (Color Computer Archive, 'CocoSiD (Remz) (Coco 3)'). It loads a 14K background picture at $1000. The author's CoCo 3 source is now in third-party/cocosid-coco3/ (cocosid.asm, and the picture cocosid_title_test2.bin), and the CoCo 2 source in third-party/cocosid-coco2/cocosid.s, so a diff of the two original sources is more useful than a fresh disassembly. Record what changed for the CoCo 2 port (GIME setup, picture, VU meter, cycle_ratio 76/92 on pitch bends, sample rate). Result (docs/coco3-vs-coco2.md): the CoCo 3 source (02-09) assembles with lwasm after removing '#' from two stores; against the CoCo 3 binary the picture, song and tables are identical (pattern pointers shifted by $170) and traced code matches instruction for instruction (410 vs 411) except one STB saving the DAC value in init_sound. The binary also has an unreachable 31-byte stub at $4AA9 calling ~370 bytes of keyboard and right-joystick reading code ($4CB2-$4E24) absent from the source. Port changes: sequencer identical; mixer moved from 92 cycles at 1.79 MHz (19,456 Hz, 381 samples/pass, phase and sample in the voice record, mixtable lookup) to 77 cycles at 0.895 MHz (227 samples/pass, self-modified LDD/ADDB operands, DP switched to the mixer page, raw sum to $FF20 with 42 added to every wave byte at start-up); voice record 21 to 18 bytes; note table and the 15 glide rates scaled by 76/92 (frequencies doubled at runtime); GIME, palette, title, VU meter, song display commented out; stack $FF00 to $8000; no $0164 auto-start; source rewritten in a different syntax (equ offsets for the struct, 1b/1f local labels). The author's assembler evaluates cycle_ratio = 76/92 in floating point (listing shows 0000), so lwasm would turn those glides into 0. Not done: a full annotated disassembly of the CoCo 3 binary, judged unnecessary given the source.", "status": "done", "priority": "medium", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["disassembly", "deleted-files"]}, {"id": 9, "type": "task", "summary": "Describe the other recovered files (SPRITE, WOLF, JOYTEST2, SCALE)", "description": "Identified by #13: each is byte-identical to a file on the author's CoCo 3 demo disk, and README.md's recovered-files table now gives the author's own descriptions (from the archived 'Rem's Coco 3 files' page). Remaining: JOYTEST2.BIN (431 bytes) is not described anywhere, and COCOSID2.BIN (3,668 bytes) is small for what the site calls the larger, automatically converted version, so check what it actually is. Low priority: not part of the CoCo 2 player. Dropped 2026-10-30: the user decided the deleted files are interesting but not important to this repo. files/deleted/ and the README's 'Recovered deleted files' section were removed; the same six files are on the author's CoCo 3 disk in third-party/cocosid-coco3/cocosid.dsk.", "status": "wontfix", "priority": "low", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["deleted-files"]}, {"id": 10, "type": "feature", "summary": "Build the player with a different song", "description": "song/song.asm is now separate source, so a new tune could be assembled into the player. Needs: a check that a changed song still fits before $6395 (WNOISE) or a relocation plan, and a note in song/README.md on writing patterns by hand. Would also allow instrument test songs (#6).", "status": "open", "priority": "low", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["song"]}, {"id": 11, "type": "task", "summary": "Identify the tune", "description": "Answered by #13: the author's source header says 'The music \"COMMANDO.SID\", by Rob Hubbard, has been hand converted to my CoCo synth-player music format', and his site says the same. Recorded in README.md (History) and song/README.md. Closed after user review.", "status": "done", "priority": "low", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["song"]}, {"id": 12, "type": "task", "summary": "Run COCOSID.BIN in XRoar and document the command", "description": "Done before tracking began (commit f019b57); user-tested: the user confirmed the tune plays. Command: xroar -machine coco2bus -rompath ~/.xroar/roms -cart rsdos -run files/COCOSID.BIN (README 'Running it'). The first attempt used a nonexistent -rompath (~/roms): XRoar then has no BASIC ROM, the log shows 'Slot 0: (unpopulated)', the screen is garbage and there is no sound. Headless check used -trap pc=0x48D7 / pc=0x4954 snapshots to a .ram file to confirm the sequencer advances.", "status": "done", "priority": "high", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["xroar", "docs"]}, {"id": 13, "type": "docs", "summary": "Research CoCoSID's author and history for the README", "description": "Found: Color Computer Archive 'Disks/Demos/CocoSiD (Remz) (Coco 2).zip' contains a cocosid.dsk byte-identical to COCOSID2.DSK, plus the original source cocosid.s and listing (13 Feb 2010); source header credits Remi Veilleux, 2010, and Rob Hubbard's Commando. The author's site 'Rem's CoCo 3' (sites.google.com/site/rveilleux, gone; Wayback captures 2012-2016) describes COCOSID, COCOSID2, COCOSID3 and his other CoCo 3 demos. CoCo Central has a post. The six deleted files on our disk match the archive's CoCo 3 disk exactly, so they were renamed. README.md has a sourced History section; song/README.md names the tune. Not used: an AtariAge thread where 'remz' posted a Wolfenstein-style CoCo 3 demo in Dec 2009 (forum blocked automated fetches, so it was not read directly); a games-industry programmer of the same name (no source links the two). The original source is not vendored: the site says 'Copyright (c) 2010 Remi Veilleux' and there is no license. Closed after user review.", "status": "done", "priority": "medium", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["docs", "history"]}, {"id": 14, "type": "task", "summary": "Cross-check the disassembly against the original source", "description": "The author's source for this exact binary is now in third-party/cocosid-coco2/ (cocosid.s and the listing cocosid.lis). Compare it with cocosid.asm / cocosid.ann and song/song.asm: fix any wrong interpretations, and consider adopting the author's names in cocosid.ann (e.g. synth_mixer, selfmod_ldd_freq1, process_voice, rect_modulator, ssynth_* voice fields) or noting them alongside ours. Result: parsed third-party/cocosid-coco2/cocosid.lis. All 7,775 bytes match the binary; instruction boundaries match the trace exactly once $484C-$484E (three unreachable RTS) were added as entries (382 = 382). Every routine label lands on one of the author's. His comments agree with our reading of the mixer (77 cycles/sample), envelope/release logic, commands, PWM and wave tables. One correction: the pattern table starts at $553D (pattern 1) and the code loads #pattern_ptr-2; SONG3 ends with its own $00, so the 'SONG3 runs into PATTERNS / entry 0 = $2C00' quirk was wrong. Fixed in cocosid.ann (label 553D PATTERNS, expr 553B PATTERNS-2), tools/songdump.py, song/song.asm, song/README.md and README.md (memory map, new 'Cross-check with the original source' section). Kept our names; author's names are noted in cocosid.ann ('Author's name: ...' in routine headers, [name] on variables and V_* fields). Also: commands 4/5 marked unused by the author; the bend command's extra byte is padding from fdb $0707/$0800. song/README.md gains a table of the author's terms. Not done: renaming our labels to his. Closed after user review.", "status": "done", "priority": "medium", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["disassembly", "history"]}, {"id": 15, "type": "task", "summary": "Add the author's original files in a third-party folder", "description": "Keep the author's own material found in #13 and later in third-party/, unmodified, with a provenance README (source URL, retrieval date, SHA-256 of each downloaded zip, what was left out and why). Sources: Color Computer Archive 'CocoSiD (Remz) (Coco 2).zip' and '(Coco 3).zip'; Wayback captures of the author's cocosid3.zip and REM_TEXTURE_DEMO.zip. Leave out files that are not his (siddump.exe by Covert Bitops, R-type.sid by Chris Huelsbeck and Ramiro Vaca) and exact duplicates of files already in the repo (the CoCo 2 cocosid.dsk and cocosid.bin). Done: third-party/ holds cocosid-coco2/ (cocosid.s, .lis, .cas), cocosid-coco3/ (demo disk, cocosid.asm, title picture), cocosid3/ (cocosid3.asm, siddump_convert_v3.pl, convert_all.bat) and rem-texture-demo/ (REM_TEXTURE_DEMO.dsk), with provenance and hashes in third-party/README.md and a -text rule in .gitattributes. Closed after user review.", "status": "done", "priority": "medium", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["history", "third-party"]}, {"id": 16, "type": "docs", "summary": "Document the .sid (PSID/RSID) file format", "description": "COCOSID2 and COCOSID3 were converted from C64 .sid files (third-party/cocosid3, author's guide). Write docs/sid-format.md describing the PSID/RSID format from the official HVSC specification (cite it), how a .sid player is driven (init/play calls, 50 Hz frames), and how that relates to the author's SIDDUMP -> Perl -> CoCoSID pattern pipeline. Use the R-type.sid header (not in the repo) only as a worked example of field values. Done: docs/sid-format.md summarises the HVSC spec (v1-v5, updated 2026-10-09; linked, not copied): what a .sid is, PSID vs RSID, header fields and flags, R-type.sid as a worked example, and the author's SIDDUMP -> siddump_convert_v3.pl -> .cid pipeline (pulse width is not read by the script). Not covered: the multi-SID v5 details and the full C64 environment setup; the page points to the spec. Closed after user review.", "status": "done", "priority": "low", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["docs", "sid"]}, {"id": 17, "type": "docs", "summary": "Link to SIDDUMP's source instead of shipping siddump.exe", "description": "siddump.exe (from the author's cocosid3.zip, dated 2007-01-08, version 1.04 or earlier judging by its options) was left out of third-party/. SIDDUMP is copyright 2005-2026 Lasse Oorni, Stein Pedersen and Michael Troelsen under a BSD 3-clause style license (readme.txt in github.com/cadaver/siddump; license text traceable only to V1.06 in 2017, the 2007 binary carries no license text). User decision: link to the official repository rather than include the binary. Add the link and license note in third-party/README.md and docs/sid-format.md. Done: both pages link github.com/cadaver/siddump and name the license; the binary stays out of the repo. Closed after user review.", "status": "done", "priority": "low", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["docs", "third-party", "sid"]}, {"id": 18, "type": "docs", "summary": "Add an MIT license for the project's own work", "description": "The repo had no license. User decision: MIT for everything that is ours (tools/, cocosid.ann, the READMEs and docs/, the issue tracker files). LICENSE must exclude, and README must say so: COCOSID2.DSK, files/ (the binaries extracted and recovered from it), cocosid.asm and song/song.asm (generated from the author's copyrighted binary; the song is Rob Hubbard's Commando), and third-party/ (see its README). Done: LICENSE (MIT, Copyright (c) 2026 Paul Cunningham) with a Scope section listing what is covered and excluded; README has a License section. tools/issues_html.py is included as the user's own work. Closed after user review.", "status": "done", "priority": "medium", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["docs", "license"]}, {"id": 19, "type": "task", "summary": "Rebuild COCOSID3 (R-Type, 2012) and compare its player with the CoCo 2 one", "description": "COCOSID3 is the author's latest CoCoSID (CoCo 3 only, 2012-10, R-Type via his SIDDUMP/Perl toolchain). Its binary is COCOSID3.BIN (10,336 bytes) on third-party/rem-texture-demo/REM_TEXTURE_DEMO.dsk; his source is third-party/cocosid3/cocosid3.asm, but the song data (crazycomets_t1-3.cid) is not in his package, so the binary is the only record of it. Extract the binary, produce a byte-identical disassembly using his labels, and write up what changed in the player between the 2010 CoCo 2 build (cocosid.asm) and COCOSID3. Result: no dis6809 disassembly was needed, because the author's source reassembles exactly. COCOSID3.BIN extracted to files/cocosid3/. tools/cid3dump.py decodes the song data ($1377-$3519) into cocosid3/song/crazycomets_t1-3.cid in the Perl script's format and labels (pattern_tN_MM, song_voiceN): 23/22/25 unique patterns, 93 per voice, 96 frames each, with every pattern checked for exactly 96 frames and valid batch references. tools/cocosid3_lwasm.py writes cocosid3/cocosid3.asm from the unmodified third-party source with six listed edits: stb #$FF20 and sta #BORDERCOLOR without '#', two size guards removed, pragma noindex0tonone (his assembler encodes 'std ssynth.freq,u' as ED 40), and zmb for the 804 zero bytes of voice records he emitted. lwasm -I cocosid3/song then loads the same 10,311 bytes and exec $1000 as the original (tools/decb_cmp.py). The files are not cmp-identical, only because his assembler wrote $1000-$1011 as a separate block and lwasm merges it. cocosid3/README.md covers the build, run command (xroar -machine coco3), memory map, and the comparison: per-frame wave+frequency words instead of notes and instruments; per-pattern batch compression and pattern dedup (8,611 bytes vs 53,568 raw); 16-bit song lists; 1.79 MHz, 76-cycle loop (about 23.6 kHz), 463 samples per pass with 8x phase catch-up, one song step per 50 Hz frame; stackless main loop; sine is a copy of triangle; LFSR noise generated at start-up; GIME graphics mode set but the title picture code is commented out. README.md (History, Contents, new COCOSID3 section, License), LICENSE scope and third-party/README.md updated. Tested by the user in XRoar (coco3): the music plays and the screen shows random patterns, as expected with the title code commented out. Timing it is left to a follow-up issue.", "priority": "medium", "status": "done", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["cocosid3", "disassembly"]}, {"id": 20, "type": "task", "summary": "Time COCOSID3's song in XRoar", "description": "From the COCOSID3 rebuild (issue 19). The song is 93 patterns of 96 frames, 8,928 frames, so 2:58.6 if the mixer really makes 50 passes a second. That rate is the author's design figure (463 samples of 76 cycles plus song processing at 1.79 MHz), not a measurement. Time one full loop in XRoar (-machine coco3, see cocosid3/README.md) and record the result in cocosid3/README.md's 'What this song uses' section. Compare: issue 5 does the same for the 2010 player.", "priority": "low", "status": "open", "created": "2026-10-30", "updated": "2026-10-30", "tags": ["cocosid3", "timing"]}], "roadmap": []}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
